<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artikel | SMKN 10 Semarang</title>
  <meta name="description" content="Berita dan artikel SMKN 10 Semarang.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1220'/%3E%3Cg fill='none' stroke='%2322D3EE' stroke-width='5' stroke-linecap='round'%3E%3Ccircle cx='32' cy='16' r='7'/%3E%3Cpath d='M32 23v30M15 34H8a24 24 0 0 0 48 0h-7'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>
  <div data-component="sprite"></div>
  <header class="navbar" id="navbar" data-component="navbar" data-active="berita"></header>

  <!-- ═══════════ PAGE HERO ═══════════ -->
  <section class="page-hero">
    <div class="hero__mesh" aria-hidden="true">
      <span class="blob blob--a"></span>
      <span class="blob blob--b"></span>
    </div>
    <div class="container" style="max-width:860px">
      <p class="page-hero__crumb"><a href="index.html">Beranda</a> <span>/</span> <a href="berita.html">Berita</a> <span>/</span> Artikel</p>
      <p class="hero__kicker" id="aMeta" style="margin-bottom:16px">Memuat…</p>
      <h1 id="aJudul" style="font-size:clamp(1.7rem,3.6vw,2.6rem)">Memuat artikel…</h1>
    </div>
  </section>

  <!-- ═══════════ ISI ARTIKEL ═══════════ -->
  <section class="section">
    <div class="container" style="max-width:800px">
      <article class="artikel" id="aIsi">
        <p class="lead">Memuat isi artikel…</p>
      </article>
      <p class="form-note" id="aSumber" style="margin-top:30px"></p>
      <div style="margin-top:30px">
        <a href="berita.html" class="btn btn--outline btn--sm">&larr; Kembali ke Berita</a>
      </div>
    </div>
  </section>

  <footer class="footer" data-component="footer"></footer>
  <div data-component="chat"></div>

  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/components.js" defer></script>
  <script src="assets/js/main.js" defer></script>
  <script defer>
  window.addEventListener("DOMContentLoaded", async () => {
    const bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const id = new URLSearchParams(location.search).get("id");
    const elMeta = document.getElementById("aMeta");
    const elJudul = document.getElementById("aJudul");
    const elIsi = document.getElementById("aIsi");
    const elSumber = document.getElementById("aSumber");
    try {
      const res = await fetch(window.SITE_CONFIG.API_BASE + "/berita.json?v=" + Math.floor(Date.now()/60000), { cache: "no-cache" });
      const rows = await res.json();
      const a = rows.find((r) => r.slug === id);
      if (!a) throw new Error("tidak ditemukan");
      const d = new Date(a.tanggal + "T00:00:00");
      document.title = a.judul + " | SMKN 10 Semarang";
      elMeta.textContent = `${d.getDate()} ${bulan[d.getMonth()]} ${d.getFullYear()}`;
      elJudul.textContent = a.judul;
      elIsi.innerHTML = (a.isi || [a.ringkasan]).map((p) => `<p>${esc(p)}</p>`).join("");
      if (a.sumber) elSumber.innerHTML = `Artikel ini dimigrasikan dari arsip situs lama SMKN 10 Semarang (<a href="${esc(a.sumber)}" target="_blank" rel="noopener">sumber asli</a>).`;
    } catch (e) {
      elMeta.textContent = "Artikel tidak ditemukan";
      elJudul.textContent = "Artikel tidak tersedia";
      elIsi.innerHTML = `<p class="lead">Maaf, artikel yang Anda cari tidak ditemukan. Silakan kembali ke <a href="berita.html" style="color:var(--c2);font-weight:700">halaman berita</a>.</p>`;
    }
  });
  </script>
</body>
</html>
